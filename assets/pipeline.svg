<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker></defs>
  <rect width="1000" height="420" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">End-to-End ML Workflow</text>
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="40"  y="70" width="260" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="170" y="100" font-weight="700">1 · Upload &amp; validate</text><text x="170" y="124" font-size="12" fill="#334155">Extension, size, columns, dtypes</text>
    <rect x="370" y="70" width="260" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="500" y="100" font-weight="700">2 · EDA &amp; imbalance review</text><text x="500" y="124" font-size="12" fill="#334155">Missing, duplicates, class ratio</text>
    <rect x="700" y="70" width="260" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="830" y="100" font-weight="700">3 · Stratified split</text><text x="830" y="124" font-size="12" fill="#334155">Train / validation / isolated test</text>

    <rect x="700" y="170" width="260" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="830" y="200" font-weight="700">4 · Preprocess (train-fit)</text><text x="830" y="224" font-size="12" fill="#334155">Scaling inside sklearn Pipeline</text>
    <rect x="370" y="170" width="260" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="500" y="200" font-weight="700">5 · Train &amp; compare</text><text x="500" y="224" font-size="12" fill="#334155">Baselines → RF, SVM, NB, tuning</text>
    <rect x="40"  y="170" width="260" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="170" y="200" font-weight="700">6 · Threshold selection</text><text x="170" y="224" font-size="12" fill="#334155">Precision / recall trade-off</text>

    <rect x="40"  y="270" width="260" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="170" y="300" font-weight="700">7 · Isolation Forest</text><text x="170" y="324" font-size="12" fill="#334155">Separate anomaly signal</text>
    <rect x="370" y="270" width="260" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="500" y="300" font-weight="700">8 · Risk band &amp; explanation</text><text x="500" y="324" font-size="12" fill="#334155">Dashboard + investigation view</text>
    <rect x="700" y="270" width="260" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="830" y="300" font-weight="700">9 · Export &amp; record</text><text x="830" y="324" font-size="12" fill="#334155">CSV/Excel, model version, metrics</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#p)">
    <line x1="300" y1="110" x2="368" y2="110"/><line x1="630" y1="110" x2="698" y2="110"/>
    <line x1="830" y1="150" x2="830" y2="168"/>
    <line x1="698" y1="210" x2="632" y2="210"/><line x1="368" y1="210" x2="302" y2="210"/>
    <line x1="170" y1="250" x2="170" y2="268"/>
    <line x1="302" y1="310" x2="368" y2="310"/><line x1="632" y1="310" x2="698" y2="310"/>
  </g>
  <text x="500" y="392" text-anchor="middle" font-size="12" fill="#64748b">The test set stays untouched until final reporting · all transforms are fitted on training data only</text>
</svg>
